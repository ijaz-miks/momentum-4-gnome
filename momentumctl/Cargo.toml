[package]
name = "momentumctl"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1.0.103"
bluer = { version = "0.17.4", features = ["full"] }
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.11"
futures-util = "0.3.32"
log = "0.4.33"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
uuid = "1.23.4"
